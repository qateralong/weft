name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  WINTUN_VERSION: 0.14.1
  NFPM_VERSION: 2.41.0
  WIX_VERSION: 5.0.2

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo build --release --locked -p weftd -p weft -p weft-gui -p loom
      - name: Packages
        run: |
          curl -fsSL -o nfpm.deb "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i nfpm.deb
          export VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml) ARCH=amd64
          mkdir dist
          for name in weft loom; do
            for packager in deb rpm; do
              nfpm package --config "packaging/linux/nfpm-$name.yaml" --packager "$packager" --target dist/
            done
          done
          ls -l dist
      - name: Install and run the deb packages
        run: |
          sudo apt-get install -y ./dist/weft_*_amd64.deb ./dist/weft-loom_*_amd64.deb
          getent group weft
          systemctl is-active weftd
          sudo weft status
          sudo systemctl start loom
          systemctl is-active loom
          sudo -u loom loom --config /etc/loom/loom.toml link --host 127.0.0.1
          sudo apt-get remove -y weft weft-loom
          ! systemctl is-active weftd
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p weftd -p weft -p weft-gui
      - name: MSI
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-$env:WINTUN_VERSION.zip" -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun
          Copy-Item wintun/wintun/bin/amd64/wintun.dll target/release/
          dotnet tool install --global wix --version $env:WIX_VERSION
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory dist | Out-Null
          wix build packaging/windows/weft.wxs -arch x64 -d Version=$version -d Bin=target\release -o "dist\weft-$version-x64.msi"
      - name: Install and run the MSI
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\*.msi).FullName
          Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait
          Start-Sleep 5
          (Get-Service weftd).Status
          if ((Get-Service weftd).Status -ne 'Running') { Get-Content install.log -Tail 50; exit 1 }
          & "$env:ProgramFiles\Weft\weft.exe" status
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait
          if (Get-Service weftd -ErrorAction SilentlyContinue) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.msi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p weftd -p weft -p weft-gui
      - name: Package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          mkdir dist
          packaging/macos/build-pkg.sh "$version" "dist/weft-$version-$(uname -m).pkg"
      - name: Install and run the package
        run: |
          sudo installer -pkg dist/*.pkg -target /
          sleep 5
          dseditgroup -o read weft > /dev/null
          sudo launchctl print system/org.weft.weftd | grep -q 'state = running'
          sudo weft status
          test -x /Applications/Weft.app/Contents/MacOS/weft-gui
          sudo /usr/local/share/weft/uninstall.sh
          ! sudo launchctl print system/org.weft.weftd > /dev/null 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  loom-static:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - run: cross build --release --locked -p loom --target ${{ matrix.target }}
      - run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/loom dist/loom-${{ matrix.target }}
          file dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: loom-${{ matrix.target }}
          path: dist/*

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f packaging/docker/Dockerfile -t ghcr.io/qateralong/loom:latest .
      - name: Run
        run: |
          docker run -d --name loom --network host ghcr.io/qateralong/loom:latest
          sleep 2
          docker exec loom loom link --host 127.0.0.1
          docker logs loom
          test "$(docker inspect -f '{{.State.Running}}' loom)" = true
      - if: startsWith(github.ref, 'refs/tags/v')
        name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          version=${GITHUB_REF_NAME#v}
          docker tag ghcr.io/qateralong/loom:latest "ghcr.io/qateralong/loom:$version"
          docker push ghcr.io/qateralong/loom:latest
          docker push "ghcr.io/qateralong/loom:$version"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, docker, loom-static]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Weft ${GITHUB_REF_NAME#v}" --notes ""
