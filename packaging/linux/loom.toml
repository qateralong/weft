# Weft coordination server. Restart after changes: systemctl restart loom
# Print the server link for clients: sudo -u loom loom --config /etc/loom/loom.toml link
# Manage the running server: sudo loom --config /etc/loom/loom.toml admin stats
listen = "0.0.0.0:443"
# Host name or IP address that clients connect to.
# public_host = "vpn.example.com"
data_dir = "/var/lib/loom"
# pool = "100.64.0.0/10"
# max_members = 250
# Relay limits in Mbit/s for peers that cannot connect directly; 0 means no limit.
# relay_mbit = 32
# relay_total_mbit = 0
# Clients wrap the connection in TLS so it looks like HTTPS. A certificate for public_host
# (for example from Let's Encrypt) makes the disguise complete; otherwise a self-signed one is used.
# tls_cert = "/etc/loom/fullchain.pem"
# tls_key = "/etc/loom/privkey.pem"
