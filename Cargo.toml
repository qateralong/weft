[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.7.4"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/qateralong/weft"
publish = false

[workspace.dependencies]
weft-proto = { path = "crates/weft-proto" }
weft-session = { path = "crates/weft-session" }
weft-mesh = { path = "crates/weft-mesh" }
weft-tun = { path = "crates/weft-tun" }
weft-portmap = { path = "crates/weft-portmap" }
weft-ipc = { path = "crates/weft-ipc" }
weft-i18n = { path = "crates/weft-i18n" }
weft-sim = { path = "crates/weft-sim" }
loom = { path = "crates/loom" }

argon2 = "0.6"
blake2 = "0.11"
chacha20 = "0.10"
chacha20poly1305 = "0.11"
clap = "4.6"
crab_nat = "0.8"
data-encoding = "2.11"
fluent-bundle = "0.16"
getrandom = "0.4"
idna = "1"
igd-next = { version = "0.18", default-features = false, features = ["aio_tokio"] }
netdev = "0.46"
nix = { version = "0.30", features = ["resource", "user"] }
prost = "0.14"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
rand = { version = "0.10", default-features = false, features = ["std", "std_rng", "thread_rng"] }
rpassword = "7.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
russh = { version = "0.64", default-features = false, features = ["ring", "flate2"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "software-renderer-systemfonts", "software-renderer-path", "accessibility", "system-tray"] }
slint-build = "1.18"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
dirs = "7"
notify-rust = "4.18"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
socket2 = "0.6"
snow = { version = "0.10", default-features = false, features = ["default-resolver", "use-blake2", "use-chacha20poly1305", "use-curve25519", "use-getrandom"] }
sys-locale = "0.3"
thiserror = "2"
tokio = { version = "1.53", features = ["full"] }
toml = "1.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tun-rs = { version = "2.8", features = ["async_tokio"] }
unic-langid = { version = "0.9", features = ["macros"] }
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
